[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsctl"
version = "0.1.0"
description = "通用 AI 开发工作区管理原型：CLI + MCP + Git 友好的 Markdown/YAML 数据"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0,<2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
wsctl = "wsctl.cli.main:main"
wsctl-mcp = "wsctl.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
